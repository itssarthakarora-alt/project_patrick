
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Maintenance</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #222222;
      min-height: 100vh;
    }

    .status {
      position: absolute;
      top: 20px;
      right: 24px;
      background: #111111;
      color: #ffffff;
      padding: 7px 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    h1 {
      font-size: clamp(26px, 4vw, 36px);
      font-weight: 600;
      margin-bottom: 14px;
    }

    p {
      font-size: 15px;
      line-height: 1.7;
      color: #666666;
      max-width: 420px;
    }

    .divider {
      width: 42px;
      height: 2px;
      background: #222222;
      margin-bottom: 26px;
    }

    footer {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: #888888;
    }
  </style>
</head>

<body>
  <div class="status">Under Maintenance</div>

  <main>
    <div class="divider"></div>
    <h1>We'll Be Right Back</h1>
    <p>
      Our website is currently undergoing scheduled maintenance.
      We apologize for the inconvenience and appreciate your patience.
    </p>
  </main>

  <footer>
    Thank you for your understanding.
  </footer>
</body>
</html>
